<script src=https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js></script>
<script>
    const canvas = document.getElementById("constellation-canvas"),
        ctx = canvas.getContext("2d"),
        clearBtn = document.getElementById("clear-btn"),
        randomBtn = document.getElementById("random-btn"),
        starCountDisplay = document.getElementById("star-count"),
        autoToggle = document.getElementById("auto-toggle"),
        saveGifBtn = document.getElementById("save-gif"),
        fullscreenBtn = document.getElementById("fullscreen-btn"),
        info = document.getElementById("info");

    let tempX, tempY, stars = [], manualLines = [], isDragging = false, dragStartStar = null;
    const maxDistance = 850, minDistance = 50;

    function drawCanvasBackground() {
        const gradient = ctx.createRadialGradient(
            canvas.width / 2, canvas.height, 0,
            canvas.width / 2, canvas.height, canvas.height
        );
        gradient.addColorStop(0, "#1b2735");
        gradient.addColorStop(1, "#090a0f");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawBackgroundStars();
    }

    function drawBackgroundStars() {
        for (let i = 0; i < 80; i++) {
            const x = (73 * i) % canvas.width;
            const y = (97 * i) % canvas.height;
            ctx.beginPath();
            ctx.arc(x, y, 1.2 * Math.random(), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.4})`;
            ctx.fill();
        }
    }

    function resizeCanvas() {
        if (document.body.classList.contains("fullscreen")) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        } else {
            canvas.width = Math.min(0.95 * window.innerWidth, 1400);
            canvas.height = Math.min(0.8 * window.innerHeight, 800);
            if (canvas.width < 800) canvas.width = 800;
            if (canvas.height < 600) canvas.height = 600;
        }
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    class Star {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.pulse = Math.random() * Math.PI;
        }
        draw() {
            this.pulse += 0.05;
            const scale = 1 + 0.2 * Math.sin(this.pulse);
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4 * scale, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#0ff";
            ctx.fill();

            const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 12);
            glow.addColorStop(0, "rgba(0,255,255,0.8)");
            glow.addColorStop(1, "rgba(0,255,255,0)");
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function connectTwo(a, b, opacity = 0.7) {
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const alpha = opacity * (1 - dist / maxDistance);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(0,255,255,${alpha})`;
        ctx.lineWidth = 1.2 + 1.5 * alpha;
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#0ff";
        ctx.stroke();
    }

    function autoConnect() {
        for (let i = 0; i < stars.length; i++)
            for (let j = i + 1; j < stars.length; j++) {
                const d = Math.hypot(stars[i].x - stars[j].x, stars[i].y - stars[j].y);
                if (d < maxDistance && d > minDistance) connectTwo(stars[i], stars[j], 0.7);
            }
    }

    function drawManualLines() {
        manualLines.forEach(line => connectTwo(line.from, line.to, 0.95));
    }

    function redrawFullScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawCanvasBackground();
        if (autoToggle.checked) autoConnect();
        drawManualLines();
        stars.forEach(s => s.draw());
    }

    function animate() {
        redrawFullScene();
        if (isDragging && dragStartStar) {
            ctx.beginPath();
            ctx.moveTo(dragStartStar.x, dragStartStar.y);
            ctx.lineTo(tempX, tempY);
            ctx.strokeStyle = "rgba(0,255,255,0.6)";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        requestAnimationFrame(animate);
    }

    function updateStarCount() {
        starCountDisplay.textContent = `Stars: ${stars.length}`;
    }

    // Mouse / Touch Events (unchanged, just cleaned up)
    canvas.addEventListener("mousedown", e => {
        if (autoToggle.checked) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const star = stars.find(s => Math.hypot(s.x - x, s.y - y) < 16);
        if (star) { isDragging = true; dragStartStar = star; }
    });

    canvas.addEventListener("mousemove", e => {
        const rect = canvas.getBoundingClientRect();
        tempX = e.clientX - rect.left;
        tempY = e.clientY - rect.top;
    });

    document.addEventListener("mouseup", e => {
        if (!isDragging || !dragStartStar) return;
        const rect = canvas.getBoundingClientRect();
        const x = Math.max(0, Math.min(e.clientX - rect.left, canvas.width));
        const y = Math.max(0, Math.min(e.clientY - rect.top, canvas.height));
        let closest = null, bestDist = 80;
        for (const s of stars) {
            if (s === dragStartStar) continue;
            const d = Math.hypot(s.x - x, s.y - y);
            if (d < bestDist) { bestDist = d; closest = s; }
        }
        if (closest) manualLines.push({ from: dragStartStar, to: closest });
        isDragging = false; dragStartStar = null;
    });

    canvas.addEventListener("click", e => {
        if (isDragging) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (stars.some(s => Math.hypot(s.x - x, s.y - y) < 40)) return;
        stars.push(new Star(x, y));
        updateStarCount();
    });

    clearBtn.onclick = () => { stars = []; manualLines = []; updateStarCount(); };
    randomBtn.onclick = () => {
        const count = Math.floor(Math.random() * 8) + 5;
        for (let i = 0; i < count; i++) {
            let x, y, valid;
            do {
                x = Math.random() * canvas.width;
                y = Math.random() * canvas.height;
                valid = stars.every(s => Math.hypot(s.x - x, s.y - y) >= 50);
            } while (!valid);
            stars.push(new Star(x, y));
        }
        updateStarCount();
    };

    autoToggle.addEventListener("change", () => {
        info.textContent = autoToggle.checked
            ? "Click to place stars | Nearby stars connect automatically"
            : "Click a star → drag → release near another to connect";
    });

    fullscreenBtn.onclick = () => {
        document.body.classList.toggle("fullscreen");
        fullscreenBtn.textContent = document.body.classList.contains("fullscreen")
            ? "Exit Fullscreen" : "Enter Fullscreen";
        resizeCanvas();
    };

    // ———————— FIXED & BEAUTIFUL GIF EXPORT ————————
    let gif = null;
    saveGifBtn.addEventListener("click", () => {
        if (gif) return;

        saveGifBtn.disabled = true;
        saveGifBtn.textContent = "Preparing…";

        gif = new GIF({
            workers: 4,
            quality: 10,
            width: canvas.width,
            height: canvas.height,
            workerScript: "gif.worker.js"  // ← Your local file (already uploaded)
        });

        const totalFrames = 120;  // ~6 seconds of smooth animation
        let frame = 0;

        // Save original pulses so we can make a nice smooth loop
        const originalPulses = stars.map(s => s.pulse);

        const capture = () => {
            // Redraw everything perfectly
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawCanvasBackground();
            if (autoToggle.checked) autoConnect();
            drawManualLines();

            // Optional: slow beautiful rotation
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(frame * 0.008);  // Remove this line if you don't want rotation
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            // Draw stars with smooth pulsing
            stars.forEach((star, i) => {
                star.pulse = originalPulses[i] + frame * 0.05;  // consistent animation
                star.draw();
            });

            ctx.restore();

            gif.addFrame(ctx, { copy: true, delay: 50 });

            frame++;
            saveGifBtn.textContent = `Recording… ${Math.round(frame / totalFrames * 100)}%`;

            if (frame < totalFrames) {
                setTimeout(capture, 1);
            } else {
                gif.on("finished", blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `my-constellation-${Date.now()}.gif`;
                    a.click();
                    URL.revokeObjectURL(url);

                    saveGifBtn.disabled = false;
                    saveGifBtn.textContent = "Save as GIF";
                    gif = null;
                });
                gif.render();
            }
        };

        capture();
    });

    // Start animation
    animate();
</script>
