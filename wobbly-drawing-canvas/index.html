licy/"' class="privacy-link">Privacy Policy</span> </p></footer><script>const canvas = document.getElementById('canvas');const ctx = canvas.getContext('2d');canvas.width = window.innerWidth;canvas.height = window.innerHeight;let drawing = false;let currentLine = [];let doodles = [];let mouse = {x:0,y:0};let mode = "draw"; const eraserRadius = 20;class Point { constructor(x,y){ this.x = x; this.y = y; this.ox = x; this.oy = y; this.vx = 0; this.vy = 0; } update(){ let dx = this.ox - this.x; let dy = this.oy - this.y; this.vx += dx * 0.05; this.vy += dy * 0.05; let mx = mouse.x - this.x; let my = mouse.y - this.y; let dist = Math.sqrt(mx*mx + my*my); if(dist<100){ let force = (100-dist)/100; this.vx -= mx*0.1*force; this.vy -= my*0.1*force; } this.vx *= 0.8; this.vy *= 0.8; this.x += this.vx; this.y += this.vy; }}class Doodle{ constructor(points,color){ this.points = points.map(p=>new Point(p.x,p.y)); this.color = color; } update(){ this.points.forEach(p=>p.update()); if(mode === "erase") this.erase(); } draw(){ if(this.points.length<2) return; ctx.beginPath(); ctx.moveTo(this.points[0].x,this.points[0].y); for(let i=1;i<this.points.length;i++){ ctx.lineTo(this.points[i].x,this.points[i].y); } ctx.strokeStyle = this.color; ctx.lineWidth = 3; ctx.stroke(); } erase(){ let segments = []; let temp = []; for(let p of this.points){ let dx = p.x - mouse.x; let dy = p.y - mouse.y; if(Math.sqrt(dx*dx + dy*dy) > eraserRadius){ temp.push(p); } else { if(temp.length>0){ segments.push([...temp]); temp = []; } } } if(temp.length>0) segments.push([...temp]);  if(segments.length>1){ doodles = doodles.filter(d=>d!==this); for(let seg of segments){ if(seg.length>1) doodles.push(new Doodle(seg.map(p=>({x:p.x,y:p.y})),this.color)); } } else { this.points = segments[0]||[]; } }}function startDrawing(x,y){ drawing = true; currentLine = [{x,y}];}function drawLine(x,y){ mouse.x = x; mouse.y = y; if(drawing && mode==="draw") currentLine.push({x,y});}function endDrawing(){ if(!drawing || currentLine.length<2) return; drawing=false; if(mode==="draw"){ const color=`hsl(${Math.random()*360},80%,60%)`; doodles.push(new Doodle(currentLine,color)); } currentLine=[];}canvas.addEventListener('mousedown', e=>startDrawing(e.clientX,e.clientY));canvas.addEventListener('mousemove', e=>drawLine(e.clientX,e.clientY));canvas.addEventListener('mouseup', endDrawing);canvas.addEventListener('mouseleave', endDrawing);canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t = e.touches[0]; startDrawing(t.clientX, t.clientY);});canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const t = e.touches[0]; drawLine(t.clientX, t.clientY);});canvas.addEventListener('touchend', e=>endDrawing());document.getElementById("toggleMode").addEventListener("click", ()=>{ if(mode==="draw"){ mode="erase"; document.getElementById("toggleMode").innerText="Switch to Draw"; }else{ mode="draw"; document.getElementById("toggleMode").innerText="Switch to Erase"; }});document.getElementById("clearCanvas").addEventListener("click", ()=>{ doodles = []; currentLine = [];});document.getElementById("fullScreen").addEventListener("click", ()=>{ if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); }});function drawCursor(){ ctx.beginPath(); ctx.arc(mouse.x, mouse.y, mode==="erase"?eraserRadius:10, 0, Math.PI*2); ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();}function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); if(currentLine.length>1){ ctx.beginPath(); ctx.moveTo(currentLine[0].x,currentLine[0].y); for(let i=1;i<currentLine.length;i++) ctx.lineTo(currentLine[i].x,currentLine[i].y); ctx.strokeStyle="#fff"; ctx.lineWidth=3; ctx.stroke(); } doodles.forEach(d=>{d.update(); d.draw();}); drawCursor(); requestAnimationFrame(animate);}animate();window.addEventListener('resize', ()=>{ canvas.width=window.innerWidth; canvas.height=window.innerHeight;});</script><script>  document.addEventListener("DOMContentLo
